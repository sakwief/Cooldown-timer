name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Create project files
        run: |
          mkdir -p mod && cd mod
          cat > build.gradle <<'EOF_0'
          plugins {
              id 'fabric-loom' version "${loom_version}"
          }

          version = project.mod_version
          group = 'dev.cooldowntimer'
          base { archivesName = 'cooldown-timer' }

          repositories {}

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
          }

          tasks.withType(JavaCompile).configureEach { options.release = 21 }
          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }
          EOF_0
          cat > gradle.properties <<'EOF_1'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          loom_version=1.14-SNAPSHOT
          mod_version=1.0.0
          EOF_1
          cat > settings.gradle <<'EOF_2'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF_2
          mkdir -p src/main/java/dev/cooldowntimer/mixin
          cat > src/main/java/dev/cooldowntimer/mixin/CooldownEntryAccessor.java <<'EOF_3'
          package dev.cooldowntimer.mixin;

          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.gen.Accessor;

          @Mixin(targets = "net.minecraft.entity.player.ItemCooldownManager$Entry")
          public interface CooldownEntryAccessor {
              @Accessor("endTick")
              int cdt$getEndTick();
          }
          EOF_3
          mkdir -p src/main/java/dev/cooldowntimer/mixin
          cat > src/main/java/dev/cooldowntimer/mixin/DrawContextMixin.java <<'EOF_4'
          package dev.cooldowntimer.mixin;

          import java.util.Locale;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.font.TextRenderer;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.entity.player.ItemCooldownManager;
          import net.minecraft.item.ItemStack;
          import net.minecraft.util.Identifier;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(DrawContext.class)
          public abstract class DrawContextMixin {

              @Inject(
                  method = "drawStackOverlay(Lnet/minecraft/client/font/TextRenderer;Lnet/minecraft/item/ItemStack;IILjava/lang/String;)V",
                  at = @At("TAIL")
              )
              private void cdt$drawCooldownTime(TextRenderer tr, ItemStack stack, int x, int y, String countOverride, CallbackInfo ci) {
                  if (stack.isEmpty()) return;
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (mc.player == null) return;

                  ItemCooldownManager cm = mc.player.getItemCooldownManager();
                  if (!cm.isCoolingDown(stack)) return;

                  ItemCooldownManagerAccessor acc = (ItemCooldownManagerAccessor) (Object) cm;
                  Identifier group = cm.getGroup(stack);
                  Object entry = acc.cdt$getEntries().get(group);
                  if (entry == null) return;

                  int remainingTicks = ((CooldownEntryAccessor) entry).cdt$getEndTick() - acc.cdt$getTick();
                  if (remainingTicks <= 0) return;

                  double sec = remainingTicks / 20.0;
                  String text;
                  if (sec >= 60) text = (int) (sec / 60) + "m";
                  else if (sec >= 10) text = Integer.toString((int) Math.ceil(sec));
                  else text = String.format(Locale.ROOT, "%.1f", sec);

                  float scale = 0.6f;
                  float w = tr.getWidth(text) * scale;
                  DrawContext self = (DrawContext) (Object) this;
                  self.getMatrices().pushMatrix();
                  self.getMatrices().translate(x + 17 - w, y + 1);
                  self.getMatrices().scale(scale, scale);
                  self.drawText(tr, text, 0, 0, 0xFFFFFFFF, true);
                  self.getMatrices().popMatrix();
              }
          }
          EOF_4
          mkdir -p src/main/java/dev/cooldowntimer/mixin
          cat > src/main/java/dev/cooldowntimer/mixin/ItemCooldownManagerAccessor.java <<'EOF_5'
          package dev.cooldowntimer.mixin;

          import java.util.Map;
          import net.minecraft.entity.player.ItemCooldownManager;
          import net.minecraft.util.Identifier;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.gen.Accessor;

          @Mixin(ItemCooldownManager.class)
          public interface ItemCooldownManagerAccessor {
              @Accessor("entries")
              Map<Identifier, Object> cdt$getEntries();

              @Accessor("tick")
              int cdt$getTick();
          }
          EOF_5
          mkdir -p src/main/resources
          cat > src/main/resources/cooldown-timer.mixins.json <<'EOF_6'
          {
            "required": true,
            "package": "dev.cooldowntimer.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["DrawContextMixin", "ItemCooldownManagerAccessor", "CooldownEntryAccessor"],
            "injectors": { "defaultRequire": 1 }
          }
          EOF_6
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'EOF_7'
          {
            "schemaVersion": 1,
            "id": "cooldown-timer",
            "version": "${version}",
            "name": "Cooldown Timer",
            "description": "Shows remaining item cooldown time in the slot's top-right corner.",
            "environment": "client",
            "mixins": ["cooldown-timer.mixins.json"],
            "depends": { "fabricloader": ">=0.18.0", "minecraft": "1.21.11", "java": ">=21" }
          }
          EOF_7
      - name: Build
        run: gradle build
        working-directory: mod
      - uses: actions/upload-artifact@v4
        with:
          name: cooldown-timer-jar
          path: mod/build/libs/*.jar
